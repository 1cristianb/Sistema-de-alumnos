version: "3.8"
services:
    mongo:
      image: mongo:7.0
      container_name: sistema-alumnos-mongo
      restart: unless-stopped
      ports:
        - "127.0.0.1:27017:27017"
      volumes:
        - mongo_data:/data/db
      healthcheck:
        test: [ "CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok" ]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s

volumes:
    mongo_data: